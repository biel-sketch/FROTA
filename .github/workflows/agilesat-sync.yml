name: Sincronizar AgileSat

on:
  # Agendamento desligado até a AgileSat liberar o acesso à API.
  # Para ligar, tire o "#" das duas linhas abaixo (roda de hora em hora, no minuto 17).
  # schedule:
  #   - cron: '17 * * * *'
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests google-auth

      - name: Ler a AgileSat e gravar no Firebase
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AGILESAT_TOKEN: ${{ secrets.AGILESAT_TOKEN }}
          AGILESAT_USUARIO: ${{ secrets.AGILESAT_USUARIO }}
          AGILESAT_SENHA: ${{ secrets.AGILESAT_SENHA }}
        run: python tools/agilesat_sync.py
