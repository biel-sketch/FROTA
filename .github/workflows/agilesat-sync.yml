name: Sincronizar AgileSat

on:
  schedule:
    # 3x por dia, horário de Brasília: 8h, 12h e 17h (o GitHub usa UTC: 11h, 15h e 20h).
    # O GitHub pode atrasar alguns minutos em horários de pico.
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      horas:
        description: 'Horas de histórico a buscar (padrão 24)'
        required: false
        default: ''

concurrency:
  group: agilesat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        continue-on-error: true
        run: pip install requests google-auth

      - name: Ler a AgileSat e gravar no Firebase
        continue-on-error: true   # nunca gera e-mail de falha; erros aparecem no painel
        env:
          AGILESAT_APIKEY: ${{ secrets.AGILESAT_APIKEY }}
          AGILESAT_SECRETKEY: ${{ secrets.AGILESAT_SECRETKEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: https://frota-f2697-default-rtdb.firebaseio.com
          AGILESAT_HORAS: ${{ github.event.inputs.horas }}
        run: python tools/agilesat_sync.py
