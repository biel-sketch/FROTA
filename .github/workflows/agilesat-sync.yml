name: Sincronizar AgileSat

on:
  schedule:
    # De hora em hora, no minuto 17
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      horas:
        description: 'Horas de histórico a buscar (use 24 ou mais na primeira vez)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        continue-on-error: true
        run: pip install requests google-auth

      - name: Ler a AgileSat e gravar no Firebase
        continue-on-error: true   # nunca gera e-mail de falha; erros aparecem no painel
        env:
          AGILESAT_APIKEY: ${{ secrets.AGILESAT_APIKEY }}
          AGILESAT_SECRETKEY: ${{ secrets.AGILESAT_SECRETKEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: https://frota-f2697-default-rtdb.firebaseio.com
          AGILESAT_HORAS: ${{ github.event.inputs.horas }}
        run: python tools/agilesat_sync.py
